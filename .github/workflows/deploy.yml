# TripTailor backend: test → Docker build → Artifact Registry → Cloud Run
#
# GitHub Actions variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID
#   GCP_REGION
#   GCP_AR_REPOSITORY
#   GCP_CLOUD_RUN_SERVICE
#   GCP_SERVICE_ACCOUNT
#   WIF_PROVIDER
#
# Do not store a Google Cloud service account JSON key in GitHub Secrets.
# Authenticate with GitHub OIDC + Workload Identity Federation instead.
#
# Set these on the Cloud Run service (Console or gcloud), not in this workflow:
#   SECRET_KEY
#   DEBUG=False
#   ALLOWED_HOSTS
#   CORS_ALLOWED_ORIGINS
#   CSRF_TRUSTED_ORIGINS
#   DATABASE_URL
#   FRONTEND_BASE_URL
#   TOUR_API_SERVICE_KEY
#   OPENAI_API_KEY
#   DEFAULT_LLM_PROVIDER
#   CORS_ALLOWED_ORIGIN_REGEXES  (optional, Vercel preview URLs)

name: Deploy to Cloud Run

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
  GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  IMAGE_NAME: triptailor-backend
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # App tests are currently Django placeholders (users/trips/schedules/common).
      # manage.py test should pass; this step is not forced to fail.
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-not-for-production
          DEBUG: "True"
        run: python manage.py test

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required GitHub variables
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION GCP_AR_REPOSITORY GCP_CLOUD_RUN_SERVICE GCP_SERVICE_ACCOUNT WIF_PROVIDER; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "Missing GitHub Actions variable: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          LATEST="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_AR_REPOSITORY}/${IMAGE_NAME}:latest"
          docker build -t "${IMAGE}" -t "${LATEST}" .
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "LATEST=${LATEST}" >> "${GITHUB_ENV}"

      - name: Push Docker image
        run: |
          docker push "${IMAGE}"
          docker push "${LATEST}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${GCP_CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --image "${IMAGE}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 16 \
            --timeout 60 \
            --quiet
